app = 'wordclimb-api'
primary_region = 'cdg'

[build]
  [build.args]
    GO_VERSION = '1.23.0'

[env]
  PORT = '8080'
  GIN_MODE = 'release'
  APP_ID = 'WORDCLIMB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

