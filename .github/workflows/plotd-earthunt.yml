name: Populate Level of the Day (earthunt)

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date for level generation (YYYY-MM-DD format, optional)'
        required: false
        type: string

jobs:
  populate-level:
    runs-on: ubuntu-latest

    # The Go module lives in server/earthunt/, not at the repo root. Without
    # this every step failed at `go mod download`, so the daily level was never
    # actually populated.
    defaults:
      run:
        working-directory: server/earthunt

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: server/earthunt/go.mod
        cache-dependency-path: server/earthunt/go.sum

    - name: Install dependencies
      run: go mod download

    # db/client.go needs the generated Prisma client to compile.
    - name: Generate Prisma client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: go run github.com/steebchen/prisma-client-go generate

    - name: Run database migrations
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: go run github.com/steebchen/prisma-client-go db push

    - name: Populate level of the day
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        if [ -n "${{ github.event.inputs.target_date }}" ]; then
          go run cmd/populate-level-of-the-day/main.go "${{ github.event.inputs.target_date }}"
        else
          # Generate for tomorrow (default behavior)
          go run cmd/populate-level-of-the-day/main.go
        fi
