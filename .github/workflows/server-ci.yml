name: Server CI & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/**"
  pull_request:
    paths:
      - "server/**"

# Both servers are independent Go modules under server/<app>/. There is no
# go.mod at server/ itself, so every step must run inside one of them — the
# previous single-job version used `working-directory: server` and failed at
# `go mod download` before ever reaching the tests.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # wordclimb is deliberately absent: its server is still earthunt's code
        # copy-pasted, with only schema.prisma converted to word ladders. It
        # references Continent and CountryCodes, which no longer exist in its
        # schema, so `go build ./cmd/api` fails — 238 geography references
        # across 7 files. That breakage predates this workflow and was hidden
        # because CI pointed at a directory with no go.mod and never ran.
        # Add wordclimb back once its server is actually ported (Phase 2).
        app: [earthunt]

    defaults:
      run:
        working-directory: server/${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/${{ matrix.app }}/go.mod
          cache-dependency-path: server/${{ matrix.app }}/go.sum

      - name: Download Go modules
        run: go mod download

      # db/client.go references the Prisma-generated client, which is not
      # committed; without this step the whole module fails to build.
      - name: Generate Prisma client
        run: go run github.com/steebchen/prisma-client-go generate

      - name: Build API binary
        run: go build ./cmd/api

      - name: Run Go tests
        run: go test ./...

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # Deploy one at a time so a failure does not leave the two APIs on
      # different revisions.
      max-parallel: 1
      matrix:
        include:
          - app: earthunt
            token_secret: FLY_EARTHUNT_API_TOKEN
          # No wordclimb deploy either: it does not compile (see the test job).
          # Deploying it would just fail at the Docker build step.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy ${{ matrix.app }} API
        working-directory: server/${{ matrix.app }}
        env:
          FLY_API_TOKEN: ${{ secrets[matrix.token_secret] }}
        run: flyctl deploy --remote-only
