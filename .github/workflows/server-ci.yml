name: Server CI & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/**"
  pull_request:
    paths:
      - "server/**"

# Both servers are independent Go modules under server/<app>/. There is no
# go.mod at server/ itself, so every step must run inside one of them — the
# previous single-job version used `working-directory: server` and failed at
# `go mod download` before ever reaching the tests.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [earthunt, wordclimb]

    defaults:
      run:
        working-directory: server/${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/${{ matrix.app }}/go.mod
          cache-dependency-path: server/${{ matrix.app }}/go.sum

      - name: Download Go modules
        run: go mod download

      # db/client.go references the Prisma-generated client, which is not
      # committed; without this step the whole module fails to build.
      - name: Generate Prisma client
        run: go run github.com/steebchen/prisma-client-go generate

      - name: Build API binary
        run: go build ./cmd/api

      - name: Run Go tests
        run: go test ./...

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # Deploy one at a time so a failure does not leave the two APIs on
      # different revisions.
      max-parallel: 1
      matrix:
        include:
          - app: earthunt
            token_secret: FLY_EARTHUNT_API_TOKEN
            db_secret: EARTHUNT_DATABASE_URL
          - app: wordclimb
            token_secret: FLY_WORDCLIMB_API_TOKEN
            db_secret: WORDCLIMB_DATABASE_URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/${{ matrix.app }}/go.mod
          cache-dependency-path: server/${{ matrix.app }}/go.sum

      # The schema has to reach the database before the code that reads it.
      # It used to be applied only by the weekly level-of-the-day cron, so a
      # column added alongside a handler went live up to seven days before its
      # migration — and never, once that cron started failing. WordClimb spent
      # weeks answering 500 on /profile for exactly that reason.
      #
      # Running it here also makes a failed migration block the deploy instead
      # of going unnoticed in a cron nobody reads.
      - name: Apply ${{ matrix.app }} database schema
        working-directory: server/${{ matrix.app }}
        env:
          DATABASE_URL: ${{ secrets[matrix.db_secret] }}
        run: ../../.github/workflows/db-push.sh

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy ${{ matrix.app }} API
        working-directory: server/${{ matrix.app }}
        env:
          FLY_API_TOKEN: ${{ secrets[matrix.token_secret] }}
        run: flyctl deploy --remote-only
