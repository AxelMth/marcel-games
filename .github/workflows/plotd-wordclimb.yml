name: Populate Level of the Day (wordclimb)

on:
  schedule:
    # Weekly, not daily: the job fills a month ahead in a single pass, so even a
    # wholly missed run leaves ~23 days of puzzles in front of the players.
    # 03:42 rather than midnight — GitHub delays scheduled jobs queued on the
    # hour, and the two games are staggered so they never contend.
    - cron: '42 3 * * 1'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Fill only this date (YYYY-MM-DD). Leave empty to fill the window.'
        required: false
        type: string
      days:
        description: 'Days ahead of today to fill when no target date is given.'
        required: false
        default: '30'
        type: string

jobs:
  populate-level:
    runs-on: ubuntu-latest

    # The Go module lives in server/wordclimb/, not at the repo root. Without
    # this every step failed at `go mod download`, so the daily level was never
    # actually populated.
    defaults:
      run:
        working-directory: server/wordclimb

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Each game has its own Postgres on its own Fly app. Both crons used to read
    # a single shared DATABASE_URL, so one of them wrote its levels — and pushed
    # its schema — into the other game's database. Failing loudly beats doing
    # that quietly.
    - name: Check the database secret is set
      env:
        DATABASE_URL: ${{ secrets.WORDCLIMB_DATABASE_URL }}
      run: |
        if [ -z "$DATABASE_URL" ]; then
          echo "::error::WORDCLIMB_DATABASE_URL is not set. Add it under Settings → Secrets and variables → Actions."
          echo "::error::It must point at the wordclimb-api database, not earthunt's."
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: server/wordclimb/go.mod
        cache-dependency-path: server/wordclimb/go.sum

    - name: Install dependencies
      run: go mod download

    # db/client.go needs the generated Prisma client to compile.
    - name: Generate Prisma client
      env:
        DATABASE_URL: ${{ secrets.WORDCLIMB_DATABASE_URL }}
      run: go run github.com/steebchen/prisma-client-go generate

    # --accept-data-loss is needed for the run that adds the (date, locale)
    # unique constraint to LevelOfTheDay: Prisma cannot prove ahead of time that
    # no two rows would collide, so it refuses without the flag. Here they
    # cannot — date was unique before, and every legacy row becomes EN.
    #
    # It is a blunt flag: it will also wave through a genuinely destructive
    # change later. Acceptable while nothing is published and there are no
    # players to lose; revisit once the games ship, ideally by moving off
    # `db push` onto real Prisma migrations.
    - name: Run database migrations
      env:
        DATABASE_URL: ${{ secrets.WORDCLIMB_DATABASE_URL }}
      run: go run github.com/steebchen/prisma-client-go db push --accept-data-loss

    # The daily challenge is drawn from the level catalogue, so the catalogue has
    # to be in the database first. Idempotent: it upserts, and rerunning it is
    # also how a regenerated catalogue reaches production.
    - name: Populate the level catalogue
      env:
        DATABASE_URL: ${{ secrets.WORDCLIMB_DATABASE_URL }}
      run: go run ./cmd/populate-levels

    - name: Populate levels of the day
      env:
        DATABASE_URL: ${{ secrets.WORDCLIMB_DATABASE_URL }}
        # Read through the environment rather than interpolated into the script:
        # a workflow input is attacker-controllable text and must never be
        # pasted straight into a shell line.
        TARGET_DATE: ${{ inputs.target_date }}
        DAYS: ${{ inputs.days || '30' }}
      run: |
        if [ -n "$TARGET_DATE" ]; then
          go run ./cmd/populate-level-of-the-day "$TARGET_DATE"
        else
          # Fills today through today+DAYS, skipping days already stored.
          go run ./cmd/populate-level-of-the-day -days "$DAYS"
        fi
