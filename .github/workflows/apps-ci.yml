name: Apps CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "turbo.json"
      - "pnpm-workspace.yaml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "turbo.json"
      - "pnpm-workspace.yaml"
      - "package.json"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # corepack must run before setup-node's cache: "pnpm", which needs the
      # pnpm binary on PATH to locate the store directory.
      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint apps and packages
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build all apps
        run: pnpm build
        env:
          # Dummy token so the earthunt production-build guard passes in CI.
          # Store builds run on AppFlow with the real token from its dashboard.
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ci-placeholder

      # WebKit only: the app runs inside WKWebView on iOS, so this is the engine
      # that matters. The suite serves the static export built above.
      - name: Install Playwright WebKit
        run: pnpm --filter @marcel-games/earthunt exec playwright install --with-deps webkit

      - name: Run end-to-end tests
        run: pnpm --filter @marcel-games/earthunt e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/earthunt/playwright-report/
          retention-days: 7

# Live Updates (OTA) deploy steps were removed along with the
# @capacitor/live-updates plugin: no JS ever called LiveUpdates.sync(), so the
# deploys had no effect, and the plugin itself was launch-crash risk in the
# store binaries. Store builds are triggered manually from the AppFlow
# dashboard (see appflow.config.json).
