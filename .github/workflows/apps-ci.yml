name: Apps CI & Appflow Live Updates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "turbo.json"
      - "pnpm-workspace.yaml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "turbo.json"
      - "pnpm-workspace.yaml"
      - "package.json"

jobs:
  build-lint-deploy:
    runs-on: ubuntu-latest

    env:
      IONIC_TOKEN: ${{ secrets.IONIC_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        run: |
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Lint apps and packages
        run: pnpm lint

      - name: Build all apps
        run: pnpm build

      # Live Updates (OTA) are deployed to Production ONLY on push to main.
      # Pull requests run lint + build above as a gate but never deploy.
      - name: Install Appflow CLI
        if: github.event_name != 'pull_request'
        run: curl -sL https://ionic.io/get-appflow-cli | bash

      - name: Build & deploy Live Update for earthunt
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          BUILD_ID=$(appflow build web --token="$IONIC_TOKEN" --app-id="$APPFLOW_ID_EARTHUNT" --commit="$GITHUB_SHA" --json | jq -r '.buildId')
          appflow deploy web --token="$IONIC_TOKEN" --app-id="$APPFLOW_ID_EARTHUNT" --build-id="$BUILD_ID" --destination="Production"
        env:
          APPFLOW_ID_EARTHUNT: ${{ secrets.APPFLOW_ID_EARTHUNT }}

      - name: Build & deploy Live Update for wordclimb
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          BUILD_ID=$(appflow build web --token="$IONIC_TOKEN" --app-id="$APPFLOW_ID_WORDCLIMB" --commit="$GITHUB_SHA" --json | jq -r '.buildId')
          appflow deploy web --token="$IONIC_TOKEN" --app-id="$APPFLOW_ID_WORDCLIMB" --build-id="$BUILD_ID" --destination="Production"
        env:
          APPFLOW_ID_WORDCLIMB: ${{ secrets.APPFLOW_ID_WORDCLIMB }}
